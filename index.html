<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sarah, is this gentleman enough?</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="card">
        <div class="sparkles">✦ ✧ ✦</div>

        <h1>Sarah with an H...</h1>

        <p class="question">
            Is this gentleman enough?
        </p>

        <p class="subtext">
            🌹 Asking for a gentleman.
        </p>

        <div class="buttons">
            <button id="noButton" class="button no-button">
                No
            </button>

            <button id="yesButton" class="button yes-button">
                Yes
            </button>
        </div>

        <p id="hint" class="hint">
            Choose wisely...
        </p>

        <div id="success" class="success hidden">
            <div class="success-heart">♥</div>

            <h2>Thank you! 🥰</h2>

            <p>
                I'll work on it.
            </p>

            <p class="small">
                Flowers may or may not be involved. 🌹
            </p>
        </div>
    </main>

    <script src="script.js"></script>

</body>
</html>
